# Gate QG-08 / QG-10: licence, advisory, ban and source policy. Every active
# licence allowance is required by a dependency in Cargo.lock; rationale is in
# docs/04-security/DEPENDENCY-LICENSE-REVIEW.md.

[graph]
targets = [
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The project is AGPL-3.0-or-later. Permissive licences are allowed without a
# separate compatibility decision. Add a licence to this active allow-list only
# when an assessed dependency in Cargo.lock requires it.
allow = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "ISC",
]
confidence-threshold = 0.8
unused-allowed-license = "warn"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Copied from the "crates we deliberately do not use" table of the dependency
    # review. Each entry has a recorded reason there.
    { name = "ffmpeg-next" },
    { name = "ffmpeg-sys" },
    { name = "cocoa" },
    { name = "dispatch" },
    { name = "rumperd" },
    { name = "libupnp-sys" },
    { name = "cargo-lint" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
