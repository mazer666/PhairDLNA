# The toolchain every contributor and every CI run uses.
#
# The channel is "stable" rather than a pinned release so that a new contributor
# does not have to download a second toolchain. The *minimum* supported version is
# pinned separately as `rust-version` in the workspace Cargo.toml, and that value is
# the one the CI matrix tests against.
[toolchain]
channel = "stable"
components = ["clippy", "rustfmt"]
profile = "minimal"
