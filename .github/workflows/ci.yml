# Manual-only continuous integration.
#
# Policy: docs/07-project/CI-POLICY.md
#   * workflow_dispatch only - no push, no pull_request, no schedule
#   * every action pinned to an exact release
#   * no secrets
#
# The auxiliary tools are installed as prebuilt binaries rather than compiled from
# source: building cargo-deny and cargo-audit from source takes longer than the
# whole rest of this workflow. The versions are the ones recorded in
# docs/04-security/DEPENDENCY-LICENSE-REVIEW.md.
name: CI

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Run every gate, including the ones that are advisory"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: Quality gates (self-hosted Linux x64)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install the auxiliary tools
        run: |
          set -euo pipefail
          tool_directory="${RUNNER_TEMP}/phairdlna-tools/bin"
          mkdir -p "${tool_directory}"
          echo "${tool_directory}" >> "${GITHUB_PATH}"
          install_tool() {
            name="$1"; url="$2"
            tmp="$(mktemp -d)"
            curl --proto '=https' --tlsv1.2 -sSfL "$url" -o "$tmp/tool.tgz"
            tar xzf "$tmp/tool.tgz" -C "$tmp"
            binary="$(find "$tmp" -type f -name "$name" | head -n 1)"
            if [ -z "$binary" ]; then
              echo "the archive for $name contains no binary named $name" >&2
              exit 1
            fi
            install -m 0755 "$binary" "${tool_directory}/${name}"
          }
          install_tool cargo-deny \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz"
          install_tool cargo-audit \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-musl-v0.23.0.tgz"
          cargo-deny --version
          cargo-audit --version

      - name: QG-01 formatting
        run: cargo fmt --all -- --check

      - name: QG-02 lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: QG-14 complexity
        run: |
          cargo clippy --workspace --all-targets -- \
            -D warnings \
            -D clippy::excessive_nesting \
            -D clippy::too_many_lines

      - name: QG-03 no unsafe code
        run: ./scripts/check-no-unsafe.sh

      - name: QG-04 build
        run: cargo build --workspace --all-targets

      - name: QG-05 unit and integration tests
        run: cargo test --workspace

      - name: QG-06 integration tests
        run: cargo test --workspace --test '*'

      - name: QG-07 doctests
        run: cargo test --workspace --doc

      - name: QG-08 licences
        run: cargo deny check licenses

      - name: QG-09 advisories
        run: cargo audit

      - name: QG-10 bans and sources
        run: cargo deny check bans sources

      - name: QG-11 documentation links
        run: ./scripts/check-doc-links.sh

      - name: QG-13 file size
        run: ./scripts/check-file-size.sh

      - name: QG-28 crate boundaries
        run: ./scripts/check-crate-boundaries.sh

      - name: Requirement views are current
        run: python3 scripts/generate_requirement_views.py --check
