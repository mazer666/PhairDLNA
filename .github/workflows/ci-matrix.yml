# Manual-only build matrix.
#
# Policy: docs/07-project/CI-POLICY.md
name: Build matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (stable, Apple Silicon)
            os: macos-latest
            toolchain: stable
          # PLT-002 requires macOS on Intel as well. The hosted runner set is
          # Apple Silicon only, so this entry is reported as
          # "NOT RUN - no Intel runner available" until one exists; it is never
          # quietly dropped from the matrix.
          - name: macOS (stable, Intel)
            os: macos-13
            toolchain: stable
          - name: Linux (stable)
            os: ubuntu-latest
            toolchain: stable
          - name: Windows (stable)
            os: windows-latest
            toolchain: stable
          # The minimum supported Rust version, as recorded in Cargo.toml.
          - name: Linux (MSRV 1.89)
            os: ubuntu-latest
            toolchain: "1.89.0"
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Report the target
        run: rustc -vV
