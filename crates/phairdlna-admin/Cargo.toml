[package]
name = "phairdlna-admin"
version = "0.0.0"
description = "The optional loopback-only administration surface of PhairDLNA."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
# The "cross-site request forgery" token is derived from the token of the
# installation with a keyed hash; the crate is already part of the build
# through the core.
blake3 = { workspace = true }
phairdlna-core = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
