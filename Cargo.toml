[workspace]
resolver = "2"
members = [
    "crates/phairdlna-core",
    "crates/phairdlna-cli",
    "crates/phairdlna-admin",
    "crates/phairdlna-mac",
]

[workspace.package]
edition = "2021"
# Minimum supported Rust version. The build matrix tests this version as well as stable.
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mazer666/PhairDLNA"

[workspace.dependencies]
phairdlna-core = { path = "crates/phairdlna-core", version = "0.1.0" }
phairdlna-admin = { path = "crates/phairdlna-admin", version = "0.1.0" }
# The object identifiers of the catalogue (ADR-0007). The `pure` feature keeps the
# build free of a C compiler, so the core stays portable and every platform in the
# build matrix compiles it without a toolchain beyond Rust itself.
blake3 = { version = "1.8", default-features = false, features = ["std", "pure"] }
# The pictures of the library: the thumbnail of a photo and the re-encoding of
# an embedded cover. Only the two formats the server serves are compiled in, so
# that the decoder surface stays small (F-10, SEC-067).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The network serving of the daemon. These live in the CLI crate and not in the
# core, so that the core stays portable and free of a runtime (ADR-0001).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "original-uri"] }
# The stream of a media answer: the trait every stream implements.
futures-core = "0.3"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "signal", "time", "macros", "io-util", "fs"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.2"
thiserror = "2.0"
tempfile = "3.27"
unicode-normalization = "0.1.26"
unicase = "2.10"
uuid = { version = "1.29", features = ["v4"] }
# The catalogue index on disk (ADR-0006, FUN-009). The `bundled` feature compiles
# the SQLite amalgamation into the binary, so that the server does not depend on the
# SQLite version of the system and cannot load an extension of it: the extension
# support of the binding stays switched off.
rusqlite = { version = "0.42", default-features = false, features = ["bundled"] }
